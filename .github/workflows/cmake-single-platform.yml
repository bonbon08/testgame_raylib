name: Build and Release

on:
  push:
    branches: [ "**" ]    
    tags:
      - 'v*'           
  pull_request:
    branches: [ "**" ]    
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Raylib Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxi-dev libxcursor-dev libgl1-mesa-dev libglu1-mesa-dev

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build Project
        run: |
          cmake --build build --config Release

      - name: Bundle Executable & Assets
        run: |
          mkdir release_assets
          # Spiel-Binary kopieren (prüft verschiedene mögliche Pfade im Build-Ordner)
          if [ -f build/spiel ]; then
            cp build/spiel release_assets/
          else
            cp spiel release_assets/
          fi
          # Bilder mit ins Paket packen
          cp *.png release_assets/ 2>/dev/null || true
          cd release_assets && zip -r ../JumperChicken-Linux.zip .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JumperChicken-Linux-Build
          path: JumperChicken-Linux.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: JumperChicken-Linux.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
