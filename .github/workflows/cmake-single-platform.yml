name: Build and Release

on:
  push:
    branches: [ "**" ]   
    tags:
      - 'v*'           
  pull_request:
    branches: [ "**" ]    

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Raylib Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxi-dev libxcursor-dev libgl1-mesa-dev libglu1-mesa-dev

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build Project
        run: |
          cmake --build build --config Release

      - name: Bundle Executable & Data
        run: |
          mkdir release_assets
          
          # Spiel-Binary kopieren
          if [ -f build/spiel ]; then
            cp build/spiel release_assets/
          else
            cp spiel release_assets/
          fi
          
          # Einzelne PNGs im Hauptordner kopieren (falls vorhanden)
          cp *.png release_assets/ 2>/dev/null || true

          # Den gesamten data/-Ordner inklusive allen Inhalten mitnehmen
          if [ -d "data" ]; then
            cp -r data release_assets/
          fi

          cd release_assets && zip -r ../JumperChicken-Linux.zip .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JumperChicken-Linux-Build
          path: JumperChicken-Linux.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: JumperChicken-Linux.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.31.6" > /dev/null

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JumperChicken-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  macos:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build (Apple Silicon + Intel)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build --config Release

      - name: Bundle JumperChicken.app
        run: |
          APP=JumperChicken.app
          mkdir -p $APP/Contents/MacOS/data $APP/Contents/Resources
          cp build/spiel $APP/Contents/MacOS/JumperChicken
          # the game looks for data/ next to its executable
          cp data/*.png data/*.wav $APP/Contents/MacOS/data/
          mkdir icon.iconset
          for size in 16 32 128 256 512; do
            sips -z $size $size store/icon-512.png --out icon.iconset/icon_${size}x${size}.png > /dev/null
            sips -z $((size*2)) $((size*2)) store/icon-512.png --out icon.iconset/icon_${size}x${size}@2x.png > /dev/null
          done
          iconutil -c icns icon.iconset -o $APP/Contents/Resources/icon.icns
          cat > $APP/Contents/Info.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Jumper Chicken</string>
            <key>CFBundleDisplayName</key><string>Jumper Chicken</string>
            <key>CFBundleIdentifier</key><string>io.github.bonbon08.jumperchicken</string>
            <key>CFBundleVersion</key><string>1.0</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleExecutable</key><string>JumperChicken</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          # ad-hoc signature, required to run on Apple Silicon
          codesign --force --deep --sign - $APP
          ditto -c -k --keepParent $APP JumperChicken-macos.zip

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: JumperChicken-macOS
          path: JumperChicken-macos.zip
