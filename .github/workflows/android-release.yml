name: Android Release APK

# Builds the Android debug APK (signed with the auto-generated debug keystore,
# installable as-is) and attaches it to a GitHub Release. Runs on GitHub's own
# runners because they already have the Android SDK/NDK and full internet
# access to fetch exactly the versions this project pins.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish the APK under (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install the pinned NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865" "cmake;3.31.6"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "JumperChicken-${{ inputs.tag }}.apk"

      - name: Create release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" "JumperChicken-${{ inputs.tag }}.apk" \
            --title "${{ inputs.tag }}" \
            --notes "Automated Android debug build from commit ${{ github.sha }}." \
            --repo "${{ github.repository }}"
