org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true

# Real AdMob IDs for release builds go into ~/.gradle/gradle.properties (never commit them):
#   jumperchicken.admobAppId=ca-app-pub-XXXXXXXXXXXXXXXX~YYYYYYYYYY
#   jumperchicken.admobRewardedId=ca-app-pub-XXXXXXXXXXXXXXXX/ZZZZZZZZZZ
# Without them every build uses Google's public test ads.

# Google Play Games leaderboard (not secret, may be committed here):
#   jumperchicken.playGamesAppId=123456789012
#   jumperchicken.leaderboardId=CgkIxxxxxxxxxxxxEAIQAQ
# Without them the leaderboard button is hidden.
